plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grupo3.signtranslator'
    compileSdk 34

    defaultConfig {
        applicationId "com.grupo3.signtranslator"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // CameraX (vista previa, análisis de imagen y ciclo de vida)
    def camerax_version = '1.4.0'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // Google ML Kit - Pose Detection (modo STREAM para vivo y SINGLE_IMAGE para fotos)
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
}
